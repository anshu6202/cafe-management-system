databases:
  - name: cafemate-db
    plan: free
    databaseName: cafemate
    user: cafemate

services:
  - type: web
    name: cafemate
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn cafe_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cafemate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "4"
